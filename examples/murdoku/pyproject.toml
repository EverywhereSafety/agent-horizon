[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-murdoku-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "long-horizon-rl==0.1.0",
    "murdoku-lab==0.1.0",
]

[project.entry-points."long_horizon_rl.environments"]
murdoku = "murdoku_demo.murdoku:MurdokuEnvironment"

[tool.setuptools.packages.find]
include = ["murdoku_demo*"]
